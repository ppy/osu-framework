on:
  # PR 只跑 pull_request，避免同一提交在「分支 push」和「PR」各跑一遍。
  # master 直推仍跑 CI（合并后 / 无 PR 的提交）。
  pull_request:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  workflow_dispatch:
name: Continuous Integration

# 同一分支/PR 上：新 run 取消尚未跑完的旧 CI，省额度；不同分支/PR 互不影响。
# group 必须带 github.ref，不要用全仓库共用一个 group，否则容易和卡死的 Queued run 缠在一起。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Roslyn + CFS 为硬门槛；PR/master 深度静态与装饰见 sonar.yml
  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu-framework.Desktop.slnf

      - name: Dotnet code style
        run: dotnet build -c Debug -warnaserror osu-framework.Desktop.slnf -p:EnforceCodeStyleInBuild=true

      - name: CodeFileSanity
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" && "$line" != *"/osu.Framework.Templates/"* ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

  test:
    name: Test
    runs-on: ${{matrix.os.fullname}}
    env:
      OSU_EXECUTION_MODE: ${{matrix.threadingMode}}
      OSU_TESTS_LOCAL_HTTPBIN: 1
    strategy:
       fail-fast: false
       matrix:
          os:
            - { prettyname: Windows, fullname: windows-latest, configuration: Debug }
            - { prettyname: macOS, fullname: macos-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Release }
          threadingMode: ['SingleThread', 'MultiThreaded']
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          cache: false

      - name: Install httpbin
        run: go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@latest

      - name: Run httpbin
        run: |
          $HOME/go/bin/go-httpbin &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/status/200 >/dev/null; then
              echo "httpbin ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::httpbin did not become ready"
          exit 1
        shell: bash

      - name: Compile
        run: dotnet build -c ${{matrix.os.configuration}} -warnaserror osu-framework.Desktop.slnf

      - name: Test
        run: dotnet test $pwd/**/*.Tests/bin/${{matrix.os.configuration}}/*/*.Tests.dll --no-build --logger "trx;LogFileName=TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx" -- NUnit.ConsoleOut=0
        shell: pwsh

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#always
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: osu-framework-test-results-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}
          path: ${{github.workspace}}/TestResults/TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx

  report-tests:
    name: Report test results
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    permissions:
      actions: read
      checks: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: osu-framework-test-results-*
          merge-multiple: true

      - name: Annotate test results
        uses: dorny/test-reporter@v2.6.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Results
          path: "*.trx"
          reporter: dotnet-trx
          list-suites: 'failed'
          list-tests: 'failed'
          fail-on-error: false

  build-only-android:
    name: Build only (Android)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 11

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Compile
        run: dotnet build -c Debug osu-framework.Android.slnf

  build-only-ios:
    name: Build only (iOS)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The .NET workload (built against/requires a specific Xcode version) and the default Xcode on the GHA runner can get out of sync.
      # Force a common Xcode version to prevent builds spontaneously failing.
      - name: Restore .NET workloads
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          dotnet workload install ios --version 10.0.402

      - name: Compile
        run: dotnet build -c Debug osu-framework.iOS.slnf

