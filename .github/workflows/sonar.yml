# 所有 PR 自动 Sonar；master 直推同步分析。PR 评论 /sonar 可由仓库 OWNER 或 PR 作者手动触发
name: SonarQube

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - master
    tags-ignore:
      - '**'

  issue_comment:
    types: [created]

env:
  SONAR_PROJECT_KEY: SK-la_ez2lazer-framework

permissions:
  contents: read
  pull-requests: read

jobs:

  sonar-auto:
    if: github.event_name == 'pull_request'

    name: Sonar Auto Review
    runs-on: windows-latest
    concurrency:
      group: sonar-auto-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $beginArgs = @(
            "begin",
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:sk-la",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.pullrequest.key=${{ github.event.pull_request.number }}",
            "/d:sonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}",
            "/d:sonar.pullrequest.base=${{ github.event.pull_request.base.ref }}"
          )
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" @beginArgs

          dotnet build -c Release osu-framework.Desktop.slnf

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end "/d:sonar.token=$env:SONAR_TOKEN"

  sonar-master:
    if: github.event_name == 'push'

    name: Sonar Master
    runs-on: windows-latest
    concurrency:
      group: sonar-master
      cancel-in-progress: true

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $beginArgs = @(
            "begin",
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:sk-la",
            "/d:sonar.token=$env:SONAR_TOKEN"
          )
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" @beginArgs

          dotnet build -c Release osu-framework.Desktop.slnf

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end "/d:sonar.token=$env:SONAR_TOKEN"

  sonar-manual:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/sonar') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.user.login == github.event.issue.user.login
      )

    name: Sonar Manual Review
    runs-on: windows-latest
    concurrency:
      group: sonar-manual-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $beginArgs = @(
            "begin",
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:sk-la",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.pullrequest.key=${{ steps.pr.outputs.number }}",
            "/d:sonar.pullrequest.branch=${{ steps.pr.outputs.head_ref }}",
            "/d:sonar.pullrequest.base=${{ steps.pr.outputs.base_ref }}"
          )
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" @beginArgs

          dotnet build -c Release osu-framework.Desktop.slnf

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end "/d:sonar.token=$env:SONAR_TOKEN"